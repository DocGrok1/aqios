<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Simulations — AURA115 · DCGP.AI</title>
<style>
:root{
  --bg:#02040c;--panel:#050e1d;--card:#07111f;--line:#1a2e47;
  --accent:#48ffe0;--dim:rgba(72,255,224,.08);--border:rgba(72,255,224,.25);
  --text:#e8f4ff;--muted:#6a85a8;--subdim:#3a506b;
  --green:#79ff9d;--gold:#ffd975;--red:#ff2d55;--cyan:#4dffe5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,"Cascadia Code",monospace;min-height:100vh}

/* ── TOPBAR ── */
#topbar{height:46px;background:#040d1c;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:10}
#topbar h1{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1.4px;text-transform:uppercase;flex:1}
.tb-pill{font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;
  background:var(--dim);color:var(--accent);border:1px solid var(--border);letter-spacing:.5px;white-space:nowrap}
.tb-count{font-size:10px;color:var(--muted)}

/* ── SEARCH ── */
#search-bar{padding:16px 20px;background:#030810;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
#search{background:#07111f;border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;font-size:12px;font-family:inherit;width:320px;outline:none}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--subdim)}
.filter-btn{font-size:10px;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;transition:.15s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--dim)}

/* ── MAIN ── */
#main{padding:24px 20px}

/* ── GROUP ── */
.group{margin-bottom:32px}
.group-label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}

/* ── CARD ── */
.sim-card{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:4px;
  transition:border-color .15s,background .15s}
.sim-card:hover{border-color:var(--accent);background:rgba(72,255,224,.04)}
.sim-num{font-size:9px;font-weight:700;color:var(--accent);letter-spacing:.1em}
.sim-name{font-size:11px;color:var(--text);line-height:1.35}

/* ── HIDDEN ── */
.hidden{display:none!important}
</style>
</head>
<body>

<div id="topbar">
  <h1>⚙ AURA115 SIMULATIONS</h1>
  <span class="tb-pill">DCGP.AI</span>
  <span class="tb-count" id="count-display">124 simulations</span>
</div>

<div id="search-bar">
  <input type="text" id="search" placeholder="Search simulations…" oninput="filterSims(this.value)"/>
  <button class="filter-btn active" onclick="setGroup('all',this)">All</button>
  <button class="filter-btn" onclick="setGroup('genesis',this)">Genesis</button>
  <button class="filter-btn" onclick="setGroup('habitation',this)">Habitation</button>

  capital: 'Capital Engine — Economic Operators',
  planets: 'Planet Nodes — Constellation Routing',
  physics: 'Physics — Quantum Operators',
  ori: 'ORI — Oracle Renormalization Intelligence',
  'dg-health': 'DG Health — Healthcare Governance',
  darpa: 'DARPA — Defense Applications',
  meta: 'Cross-Domain & Meta',
};

const GROUP_ORDER = [
  'genesis','habitation','meaning','authority','stewardship','continuity',
  'meta-recursion','mc290','capital','planets','physics','ori','dg-health','darpa','meta'
];

let activeGroup = 'all';

function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(query) {
  const q = (query || '').toLowerCase().trim();
  const main = document.getElementById('main');
  main.innerHTML = '';

  let totalVisible = 0;

  for (const gk of GROUP_ORDER) {
    const items = SIMS.filter(s =>
      s.g === gk &&
      (activeGroup === 'all' || s.g === activeGroup) &&
      (!q || s.n.includes(q) || s.t.toLowerCase().includes(q) || s.g.includes(q))
    );
    if (!items.length) continue;
    totalVisible += items.length;

    const sec = document.createElement('div');
    sec.className = 'group';
    sec.innerHTML = `<div class="group-label">${esc(GROUP_LABELS[gk])}</div><div class="grid">${
      items.map(s => `<a class="sim-card" href="/simulations/sim-${esc(s.n)}.html">
        <span class="sim-num">SIM-${esc(s.n)}</span>
        <span class="sim-name">${esc(s.t)}</span>
      </a>`).join('')
    }</div>`;
    main.appendChild(sec);
  }

  document.getElementById('count-display').textContent = totalVisible + ' simulation' + (totalVisible !== 1 ? 's' : '');
}

function filterSims(q) { render(q); }

function setGroup(g, btn) {
  activeGroup = g;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render(document.getElementById('search').value);
}

render();
</script>
